<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESOHAIRCUTS | Barber & Strzyżenie</title>

    <style>
        :root {
            --bg-dark: #070a09;
            --bg-panel: #0e1512;
            --bg-card: #131c18;
            --bottle-green: #0d3b2c;
            --bottle-green-hover: #14543f;
            --accent-emerald: #268c68;
            --accent-mint: #45b88e;
            --text-main: #eff5f2;
            --text-muted: #98a8a0;
            --border: #1e2e27;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Open Sans', sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Montserrat', sans-serif;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 10, 9, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-mint);
        }

        nav {
            display: flex;
            gap: 1.3rem;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: color 0.25s;
        }

        nav a:hover {
            color: var(--accent-mint);
        }

        /* Hero */
        .hero {
            padding: 5.5rem 5% 4.5rem;
            text-align: center;
            background: radial-gradient(circle at 50% 20%, rgba(13, 59, 44, 0.55) 0%, rgba(7, 10, 9, 1) 70%);
            border-bottom: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            background: rgba(13, 59, 44, 0.65);
            border: 1px solid var(--accent-emerald);
            color: var(--accent-mint);
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 1.2rem;
        }

        .hero h1 {
            font-size: clamp(2.1rem, 4.5vw, 3.6rem);
            font-weight: 800;
            line-height: 1.15;
            max-width: 820px;
            margin: 0 auto 1.2rem;
        }

        .hero h1 span {
            color: var(--accent-mint);
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem;
            font-size: 1.05rem;
        }

            border: 1px solid var(--accent-emerald);
